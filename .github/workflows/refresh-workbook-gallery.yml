name: Refresh tested workbook screenshots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-workbook-gallery.yml'
      - 'assets/index-DeepWorkbook-20261106.js'
permissions:
  contents: write
jobs:
  capture-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - name: Serve the production build for screenshot verification
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/office-gallery-http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/office-gallery-http.log
          exit 1
      - name: Capture all six authentic completed reports
        run: node qa/deep-workbook.test.cjs
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/
      - name: Update gallery and remove obsolete automation claims
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,html
          src=Path('qa-artifacts')
          dst=Path('screenshots')
          dst.mkdir(exist_ok=True)
          reports=[
           ('report-1.png','13a-reimbursements.png','The tutorial stays simple','The original B2/C2 drag and D2 fill-down still teach the workbook gestures.'),
           ('report-2.png','13b-supply-audit.png','Reconcile credits and charges','The player must account for a handling percentage, returned stock and a cross-row invoice total.'),
           ('report-3.png','13c-hr-audit.png','Headcount is not a shift average','Adds, departures and staff per shift require different operations; the final total excludes the average.'),
           ('report-4.png','13d-it-audit.png','A percentage and a fixed fee','A fifth reference column holds adjustments; the player chooses the formula before deciding whose licences to renew.'),
           ('report-5.png','13e-marketing-audit.png','A refund is not a surcharge','Audit charged fees, percent surcharges and returned money before interpreting the campaign metrics.'),
           ('report-6.png','13f-board-audit.png','The board demands reconciliation','Tax, rebates and discounts culminate in a formula combining earlier cells.')
          ]
          for old,new,_,_ in reports:
           p=src/old
           assert p.exists() and p.stat().st_size>25000, f'Missing genuine browser screenshot: {p}'
           shutil.copy2(p,dst/new)
          gallery=Path('gallery.html')
          text=gallery.read_text()
          text=text.replace('Earn credits, buy the macro and fill future reports in one click.',
           'Earn credits to automate the routine entries. Complex formulas and decisions still require the player.')
          marker='</div><footer>'
          assert text.count(marker)==1
          if '13a-reimbursements.png' not in text:
           blocks=[]
           for _,filename,title,desc in reports:
            file=html.escape('screenshots/'+filename,quote=True)
            blocks.append('<a class="shot" href="'+file+'" target="_blank" rel="noopener"><img loading="lazy" src="'+file+'" alt="'+html.escape(title,quote=True)+'"/><div><strong>'+html.escape(title)+'</strong><p>'+html.escape(desc)+'</p></div></a>')
           text=text.replace(marker,''.join(blocks)+marker)
          gallery.write_text(text)
          readme=Path('README.md')
          md=readme.read_text()
          md=md.replace('Formula Auto-Pilot costs 85 credits and fills report formulas, not managerial policy choices; entering formulas and dragging are free.',
            'Formula Auto-Pilot costs 85 credits and prepares routine entries. Reports 2–6 require mixed formulas, percentages and cross-row reconciliation; policy choices remain manual. Dragging and entering formulas are free.')
          md=md.replace('Addition =B2+C2 and SUM(B2:C2) also work.',
            'Report 1 teaches these gestures. Later reports demand subtraction, division, percentage adjustments, ROUND, SUM and cross-row formulas in four-row workbooks.')
          readme.write_text(md)
          print('GALLERY_SCREENSHOTS_VERIFIED_AND_UPDATED',len(reports))
          PY
      - name: Commit verified screenshots
        shell: bash
        run: |
          git config user.name 'Office Hours Visual QA'
          git config user.email '49712959+PcRoGamer@users.noreply.github.com'
          git add gallery.html README.md screenshots/
          if git diff --cached --quiet; then echo 'GALLERY_ALREADY_CURRENT'; exit 0; fi
          git commit -m 'Refresh actual workbook screenshots and automation documentation'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-workbook-gallery-evidence
          path: qa-artifacts/
