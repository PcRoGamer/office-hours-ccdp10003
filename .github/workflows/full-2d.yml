name: Full 2D edition regression
on:
  push:
    branches: [work/full-2d-20261106]
    paths:
      - '2d.html'
      - 'qa/full-2d.test.cjs'
      - '.github/workflows/full-2d.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/office2d.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/2d.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Browser regression, zero WebGL and complete 2D campaign
        run: node qa/full-2d.test.cjs
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-2d-browser-evidence
          path: qa-2d-screens/
