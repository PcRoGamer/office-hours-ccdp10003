name: Submission candidate browser verification
on:
  push:
    branches: [release/ccdp10003-final-workday-20261106, main]
    paths: [workday-final.html, assets/workday-final.js, assets/workday-final.css, qa/workday-final.test.cjs, .github/workflows/workday-final.yml]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2
      - run: node --check assets/workday-final.js
      - name: Serve exact release files
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/office-final.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/workday-final.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify browser gameplay and references
        run: node qa/workday-final.test.cjs
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/workday-final.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-hours-final-qa
          path: qa-final-artifacts/
