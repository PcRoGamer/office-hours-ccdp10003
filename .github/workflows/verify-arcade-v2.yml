name: Quota Panic V2 Fullscreen Arcade QA
on:
  push:
    branches: [main]
    paths:
      - arcade-v2.html
      - qa/arcade-v2.test.cjs
      - .github/workflows/verify-arcade-v2.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2
      - run: mkdir -p qa-artifacts
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/arcade-v2-http.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:4173/arcade-v2.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/arcade-v2-http.log; exit 1
      - run: node qa/arcade-v2.test.cjs
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/arcade-v2.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quota-panic-v2-browser-screens
          path: qa-artifacts/
