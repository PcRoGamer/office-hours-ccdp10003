name: Quota Panic Night Shift HD office QA
on:
  push:
    branches: [main]
    paths:
      - arcade-office-hd.html
      - qa/arcade-office-hd.test.cjs
      - .github/workflows/verify-office-hd.yml
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2
      - run: mkdir -p qa-artifacts
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/nightshift-hd.log 2>&1 &
          for i in $(seq 1 35); do curl -sf http://127.0.0.1:4173/arcade-office-hd.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/nightshift-hd.log; exit 1
      - name: Real browser QA
        run: node qa/arcade-office-hd.test.cjs
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/arcade-office-hd.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightshift-hd-email-excel-screens
          path: qa-artifacts/
