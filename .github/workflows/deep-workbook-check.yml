name: Deep workbook integration QA
on:
  push:
    branches: [work/deeper-spreadsheets-20261106, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  run-browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: /usr/bin/google-chrome --version
      - run: node --check assets/index-DeepWorkbook-20261106.js
      - name: Serve candidate site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/office-http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/office-http.log
          exit 1
      - run: node qa/deep-workbook.test.cjs
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/
      - name: Verify original drag gestures and advanced reasoning
        run: node qa/deep-drag.test.cjs
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/
      - name: Complete full player journey
        run: node qa/deep-campaign.test.cjs
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/
      - name: Verify Pages serves the published bundle
        if: github.ref == 'refs/heads/main'
        run: |
          for i in $(seq 1 40); do
            code=$(curl -Ls --max-time 15 'https://pcrogamer.github.io/office-hours-ccdp10003/?build='"${GITHUB_SHA}" || true)
            if echo "$code" | grep -q 'index-DeepWorkbook-20261106.js'; then
              echo "PAGES_DEPLOYED_PASSED"
              exit 0
            fi
            sleep 5
          done
          echo "PAGES_DEPLOYMENT_NOT_VERIFIED"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbook-browser-screenshots
          path: qa-artifacts/
