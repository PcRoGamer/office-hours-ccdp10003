name: Night Shift v3 - verified candidate and protected Pages release
on:
  push:
    branches: [rebuild/night-shift-v3-hd]
  pull_request:
    branches: [rebuild/night-shift-v3-hd]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Verify, publish verified candidate, or restore current main site
        required: true
        default: verify
        options: [verify, publish, rollback]
      candidate_ref:
        description: Integration branch to verify
        type: string
        default: rebuild/night-shift-v3-hd
        required: true
permissions:
  contents: read
concurrency:
  group: v3-wrap-${{github.ref }}-${{inputs.mode || 'verify' }}
  cancel-in-progress: false
jobs:
  gate:
    if: ${{inputs.mode != 'rollback' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{steps.lock.outputs.sha }}
    steps:
      - name: Prevent publication of arbitrary refs
        if: ${{inputs.mode == 'publish' }}
        env:
          CANDIDATE: ${{inputs.candidate_ref }}
        run: test "$CANDIDATE" = 'rebuild/night-shift-v3-hd'
      - uses: actions/checkout@v4
        with:
          ref: ${{inputs.candidate_ref || github.sha }}
          persist-credentials: false
      - name: Pin tested commit
        id: lock
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser, assets, pause, responsiveness and HD regression
        run: node qa/v3-wrap-release.cjs
      - name: Authored campaign contract
        run: node qa/v3-lead-director.mjs
      - name: Adversarial scoring, retry provenance and physical perk contracts
        run: |
          node qa/v3-wrap-bridge-provenance-contract.test.mjs
          node --test qa/v3-wrap-perk-1319-real-scenes.test.mjs
          node qa/v3-wrap-score.test.mjs
          node qa/v3-wrap-game.test.mjs
          node qa/v3-lead-first-perk-services.test.mjs
          node qa/v3-arcade-interactions.test.mjs
          node qa/v3-arcade-global-perk.test.mjs
      - name: Five-layout no-scroll arcade intermission and sprite asset gate
        run: node qa/v3-arcade-rescue.browser.cjs
      - name: Real pointer full campaign, score receipt, flip and replay
        run: node qa/v3-lead-scored-full.browser.cjs
      - name: Office Attack responsive smoke and sprite loading
        run: node qa/office-attack-smoke.browser.cjs
      - name: Office Attack 1,536 deterministic Dodge fairness trials
        run: node qa/office-attack-dodge-balance.browser.cjs
      - name: Office Attack 20-encounter campaign, boss retries, cited research and voluntary breaks
        run: |
          node qa/office-attack-fullrun.browser.cjs
          OFFICE_ATTACK_AUTO_INTERMISSION=1 node qa/office-attack-fullrun.browser.cjs
          OFFICE_ATTACK_AUTO_INTERMISSION=1 OFFICE_ATTACK_AUTO_RESEARCH=1 node qa/office-attack-fullrun.browser.cjs
          OFFICE_ATTACK_BOSS_RETRY=1 node qa/office-attack-fullrun.browser.cjs
          OFFICE_ATTACK_VIEWPORT=650x800 node qa/office-attack-fullrun.browser.cjs
          OFFICE_ATTACK_VIEWPORT=390x760 node qa/office-attack-fullrun.browser.cjs
      - name: Office Attack real failure, pause, expiration and replay
        run: node qa/office-attack-adversarial.browser.cjs
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-release-${{github.run_id }}
          path: |
            qa-artifacts/v3-wrap-release/
            qa/v3-lead-scored-full-evidence/
            qa/v3-arcade-rescue-evidence/
            qa/office-attack-evidence/
          if-no-files-found: warn
  release:
    needs: [gate]
    if: ${{always() && github.event_name == 'workflow_dispatch' && (inputs.mode == 'publish' || inputs.mode == 'rollback') && (inputs.mode == 'rollback' || needs.gate.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-site
          persist-credentials: false
      - uses: actions/checkout@v4
        if: ${{inputs.mode == 'publish' }}
        with:
          ref: ${{needs.gate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Stage current main + only the verified v3 route
        shell: bash
        env:
          MODE: ${{inputs.mode }}
        run: |
          set -euo pipefail
          mkdir site
          rsync -a --exclude='.git' --exclude='.github' --exclude='qa' --exclude='coordination' --exclude='design' --exclude='node_modules' main-site/ site/
          test -s site/arcade-office-hd.html
          if [[ "$MODE" == publish ]]; then
            test -s candidate/night-shift-v3.html
            test -s candidate/night-shift-v3/app.js
            cp candidate/night-shift-v3.html site/
            rm -rf site/night-shift-v3
            cp -a candidate/night-shift-v3 site/
            test -s candidate/night-shift-office-attack.html
            test -s candidate/office-attack/game.js
            cp candidate/night-shift-office-attack.html site/
            rm -rf site/office-attack
            cp -a candidate/office-attack site/
            mkdir -p site/assets
            if [[ -d candidate/assets/night-shift-v3 ]]; then
              rm -rf site/assets/night-shift-v3
              cp -a candidate/assets/night-shift-v3 site/assets/
            fi
          fi
          touch site/.nojekyll
          cmp main-site/arcade-office-hd.html site/arcade-office-hd.html
          cmp main-site/index.html site/index.html
      - uses: actions/setup-node@v4
        if: ${{inputs.mode == 'publish' }}
        with:
          node-version: '22'
      - name: Install release smoke dependencies
        if: ${{inputs.mode == 'publish' }}
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Gate the exact staged site before any deployment
        if: ${{inputs.mode == 'publish' }}
        env:
          RELEASE_SITE_ROOT: ${{github.workspace }}/site
          RELEASE_ARTIFACT_DIR: ${{github.workspace }}/qa-artifacts/staged-site
        run: node candidate/qa/v3-wrap-release.cjs
      - name: Gate new office microgame on exact staged Pages content
        if: ${{inputs.mode == 'publish' }}
        env:
          OFFICE_ATTACK_SITE_ROOT: ${{github.workspace }}/site
        run: node candidate/qa/office-attack-smoke.browser.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify public HD and candidate routes
        shell: bash
        env:
          PAGE_URL: ${{steps.deploy.outputs.page_url }}
          MODE: ${{inputs.mode }}
        run: |
          set -euo pipefail
          BASE=$(printf %s "$PAGE_URL" | sed 's:/*$::')
          curl -fL --retry 6 --retry-delay 3 "$BASE/arcade-office-hd.html" -o /tmp/hd.html
          test -s /tmp/hd.html
          if [[ "$MODE" == publish ]]; then
            curl -fL --retry 6 --retry-delay 3 "$BASE/night-shift-v3.html" -o /tmp/v3.html
            grep -q 'night-shift-v3/app.js' /tmp/v3.html
            curl -fL --retry 6 --retry-delay 3 "$BASE/night-shift-office-attack.html" -o /tmp/office-attack.html
            grep -q 'office-attack/game.js' /tmp/office-attack.html
            curl -fL --retry 6 --retry-delay 3 "$BASE/office-attack/games.js" -o /tmp/office-games.js
            test -s /tmp/office-games.js
          fi
      - name: Preserve staged-site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-staged-${{github.run_id }}
          path: qa-artifacts/staged-site/
          if-no-files-found: warn
