name: Quota Panic Night Shift browser QA
on:
  push:
    branches: [main]
    paths:
      - arcade-nightshift.html
      - qa/arcade-nightshift.test.cjs
      - .github/workflows/nightshift.yml
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2
      - run: mkdir -p qa-artifacts
      - name: Serve game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/nightshift-http.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:4173/arcade-nightshift.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/nightshift-http.log; exit 1
      - name: Play and capture
        run: node qa/arcade-nightshift.test.cjs
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/arcade-nightshift.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightshift-browser-screenshots
          path: qa-artifacts/
