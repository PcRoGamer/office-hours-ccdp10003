name: Director's Cut full-campaign integration QA
on:
  push:
    branches: [work/director-full-campaign-qa-20261106]
  workflow_dispatch:
jobs:
  full-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-save playwright@1.58.2
      - name: Serve site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/director.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: node qa/director-full-campaign.test.cjs
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: director-full-campaign-screenshots
          path: qa-artifacts/