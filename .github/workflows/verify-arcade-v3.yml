name: Quota Panic V3 Art, HUD and Gameplay QA
on:
  push:
    branches: [main]
    paths:
      - arcade-v3.html
      - qa/arcade-v3.test.cjs
      - .github/workflows/verify-arcade-v3.yml
  workflow_dispatch:
jobs:
  visual-and-interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2
      - run: mkdir -p qa-artifacts
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/quota-v3-http.log 2>&1 &
          for i in $(seq 1 35); do curl -sf http://127.0.0.1:4173/arcade-v3.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/quota-v3-http.log; exit 1
      - name: Play in Chromium
        run: node qa/arcade-v3.test.cjs
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/arcade-v3.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quota-panic-v3-screenshots
          path: qa-artifacts/
