name: Playful workbook QA
on:
  push:
    branches: [work/playful-spreadsheet-20261106]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: node --check assets/index-Playful-20261106.js
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/playful-http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: node qa/playful-workbook.test.cjs
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/
      - name: Play complete six-report shift
        run: node qa/playful-campaign.test.cjs
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playful-workbook-screens
          path: qa-playful-screens/
