function finish(){if(state.stageDone)return;state.stageDone=true;state.stats.push({name:stages[state.phase].name,progress:state.progress,score:state.score});if(state.phase===2||state.phase===4)state.screen='decision';else if(state.phase===5)state.screen='victory';else state.screen='clear';state.ads=[];state.entities=[];state.floats=[];sound('done');announce(stages[state.phase].name+' cleared!')}

function getPointer(e){const b=canvas.getBoundingClientRect();return{x:(e.clientX-b.left)*(W/b.width),y:(e.clientY-b.top)*(H/b.height)}}
function hit(e,x,y){return e.x>=x.x&&e.x<=x.x+x.w&&e.y>=x.y&&e.y<=x.y+x.h}

canvas.addEventListener('pointermove',e=>{const p=getPointer(e);mouse.x=p.x;mouse.y=p.y;canvas.style.cursor='crosshair';if(mouse.drag){mouse.drag.x=clamp(p.x-mouse.startX,105,1050);mouse.drag.y=clamp(p.y-mouse.startY,232,600)}});

function showHelp(type){let h=document.getElementById('help'),t=document.getElementById('help-title'),b=document.getElementById('help-body');state.helpFrom=state.screen;t.textContent=type==='play'?'HOW TO PLAY':'THE REAL RESEARCH';b.innerHTML=type==='play'?`<p><strong>JUST YOUR MOUSE.</strong> Click moving papers. Drag colourful files into matching drawers. Follow green charts with your cursor spotlight. Hold and sweep up coworkers. Close adverts with the X. During boss fights, stamp the enemy and dodge flying paper.</p><p>Six ridiculous disasters. If you lose focus, retry only that disaster. You never lose your whole shift.</p><p><strong>Keyboard:</strong> Enter starts/continues, Esc pauses, M toggles sound.</p>`:`<p><strong>WHY THIS GAME, WHY NOW?</strong> Offices increasingly borrow game mechanics such as scores, feedback and rewards. Sometimes those make work more enjoyable. But when a corporation designs the rules, whose version of success is being rewarded? This arcade lets you feel the rush, then question the score.</p><p><strong>Evidence and influences:</strong></p><p>• <a target="_blank" rel="noopener" href="https://doi.org/10.1016/j.elerap.2020.100994">Work gamification and enjoyment/productivity (2020)</a></p><p>• <a target="_blank" rel="noopener" href="https://doi.org/10.1145/1357054.1357072">Mark, Gudith & Klocke (2008), interrupted work</a></p><p>• <a target="_blank" rel="noopener" href="https://aaai.org/papers/ws04-04-001-mda-a-formal-approach-to-game-design-and-game-research/">Hunicke, LeBlanc & Zubek, MDA (2004)</a></p><p>• <a target="_blank" rel="noopener" href="https://mitpress.mit.edu/9780262026147/persuasive-games/">Bogost, Persuasive Games (2007)</a></p><p>• <a target="_blank" rel="noopener" href="https://link.springer.com/article/10.1007/s10551-023-05584-w">Butler & Spoelstra (2024), ethics of workplace gamification</a></p><p>The deliberately exaggerated office systems are satire, not empirical measurements of real workers. Original sounds and graphics were built for this game.</p>`;h.classList.add('show');if(state.screen==='play')state.screen='help'}
function closeHelp(){document.getElementById('help').classList.remove('show');if(state.screen==='help')state.screen=state.helpFrom}

function update(dt){if(document.getElementById('help').classList.contains('show'))return;state.time+=dt;state.titleAnim+=dt;state.shake=Math.max(0,state.shake-dt*35);state.flash=Math.max(0,state.flash-dt);state.clickCool=Math.max(0,state.clickCool-dt);
