<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QUOTA PANIC / THE QUOTA • Boss Preview</title>
<style>
:root{color-scheme:dark;font-family:Arial,'Arial Narrow',sans-serif}*,*:before,*:after{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14242a;touch-action:none}#stage{position:fixed;inset:0;width:100vw;height:100dvh;display:block;cursor:grab;touch-action:none}#stage:active{cursor:grabbing}.hud{position:fixed;top:max(15px,env(safe-area-inset-top));color:#fff3dc;z-index:2;font-size:clamp(13px,1vw,19px);font-weight:900;text-shadow:0 2px 6px #000c;pointer-events:none;letter-spacing:.03em}.left{left:max(18px,env(safe-area-inset-left))}.right{right:max(18px,env(safe-area-inset-right));text-align:right}.hud strong{color:#f8c36d;font-size:1.25em}.footer{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;gap:12px;z-index:5}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:5px;pointer-events:auto}.controls button,.controls select{background:#143b41df;border:1px solid #a1c4a3;border-radius:8px;color:#fff4da;padding:8px 10px;min-height:36px;cursor:pointer;font-size:12px;font-weight:800}.controls button:hover{background:#265b58}.stats{color:#f7eccc;text-align:right;font:800 12px/1.4 'Segoe UI',Arial,sans-serif;text-shadow:0 2px 5px #081715;pointer-events:none;background:#0a273a7a;border-radius:6px;padding:7px;max-width:360px}#event{position:fixed;bottom:64px;right:14px;z-index:5;font:600 12px/1.4 'Segoe UI',Arial;color:#fff5e1;background:#0e262ddd;padding:7px 12px;border:1px solid #b8d9c166;border-radius:8px;max-width:min(420px,75vw);pointer-events:none}#event:empty{display:none}#sr{position:absolute;left:-9999px} @media(max-width:700px){.hud{top:5px;font-size:11px}.left{left:6px}.right{right:6px}.controls select{max-width:138px}.controls button,.controls select{padding:4px 5px;font-size:10px;min-height:26px}.stats{font-size:10px;max-width:175px}.footer{bottom:2px;left:5px;right:5px;gap:3px}#event{bottom:38px}}
</style></head><body>
<canvas id="stage" aria-label="THE QUOTA physical boss demo, drag objects to highlighted destinations" tabindex="0"></canvas>
<div class="hud left" id="left">♥ ♥ ♥ &nbsp; <strong>THE QUOTA</strong></div>
<div class="hud right" id="right">BOSS • 00:00</div>
<div class="footer"><div class="controls"><label for="directive" style="position:absolute;left:-9999px">Directive</label><select id="directive"><option>DOUBLE ENTRY</option><option>MOVING GOALPOSTS</option><option>FAST OR SAFE</option><option>SPONSORED WORKFLOW</option><option>MANDATORY COLLABORATION</option></select><button id="restart">RESTART</button><button id="pause">PAUSE</button><button id="mute">MUTE</button><button id="help">?</button></div><div class="stats" id="stats">Awaiting shift...</div></div><div id="event" role="status" aria-live="polite"></div><p id="sr" aria-live="polite"></p>
<script type="module">
import {createQuotaBoss} from '../night-shift-v3/bosses/quota/quota.mjs';
const canvas=document.querySelector('canvas');const c=canvas.getContext('2d',{alpha:false});
let current,clock=0,last=0,paused=false,muted=false,received=[];
const viewport={cssWidth:0,cssHeight:0,dpr:1,worldWidth:1200,worldHeight:760,safeRect:{x:0,y:0,width:1200,height:760},worldToScreen(x,y){return {x:x*this.cssWidth/this.worldWidth,y:y*this.cssHeight/this.worldHeight}},screenToWorld(x,y){return {x:x*this.worldWidth/this.cssWidth,y:y*this.worldHeight/this.cssHeight}}};
const ctx={viewport,canvas,ctx2d:c,events:{emit(ev){received.push(ev);document.querySelector('#event').textContent=ev.type==='quota-bonus-resolved'?`${ev.objectId}: ${ev.outcome.toUpperCase()} ${ev.delta?'+5':''}`:`${ev.type.toUpperCase()} / ${ev.objectId}`;document.querySelector('#sr').textContent=document.querySelector('#event').textContent;if(!muted)beep(ev.type)}},run:{seed:2771,runId:'preview-quota-2771',currentDirective:'DOUBLE ENTRY',perkLevels:{'perk:magnet-grip':1,'perk:bank-shot':1},licences:{mira:true,jules:true},publicRelationsFrame:'context'},options:{reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches}};
function resize(){let r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,3);viewport.cssWidth=r.width;viewport.cssHeight=r.height;viewport.dpr=dpr;viewport.worldWidth=viewport.worldHeight*r.width/r.height;viewport.safeRect={x:10,y:60,width:viewport.worldWidth-20,height:viewport.worldHeight-90};canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);c.setTransform(canvas.width/viewport.worldWidth,0,0,canvas.height/viewport.worldHeight,0,0)}
function beep(kind){try{const A=window.AudioContext||window.webkitAudioContext;window._ac||=(new A());const a=window._ac,osc=a.createOscillator(),gain=a.createGain();osc.type=kind==='boss-complete'?'triangle':'sawtooth';osc.frequency.value=kind==='quota-bonus-resolved'?220:kind==='boss-phase-complete'?470:660;gain.gain.setValueAtTime(.04,a.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.13);osc.connect(gain).connect(a.destination);osc.start();osc.stop(a.currentTime+.15)}catch{}}
function restart(){ctx.run.currentDirective=document.querySelector('#directive').value;received=[];current?.dispose?.();current=createQuotaBoss(ctx);clock=0;paused=false;document.querySelector('#event').textContent='';document.querySelector('#pause').textContent='PAUSE';}
function point(e){const r=canvas.getBoundingClientRect();const p=viewport.screenToWorld(e.clientX-r.left,e.clientY-r.top);return {...p,id:e.pointerId,kind:e.pointerType}}
canvas.addEventListener('pointerdown',e=>{if(paused)return;canvas.setPointerCapture?.(e.pointerId);current.pointerDown(point(e));});canvas.addEventListener('pointermove',e=>{if(!paused)current.pointerMove(point(e))});canvas.addEventListener('pointerup',e=>{if(!paused)current.pointerUp(point(e));canvas.releasePointerCapture?.(e.pointerId)});canvas.addEventListener('pointercancel',()=>current.cancelPointer());document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true;current.cancelPointer();document.querySelector('#pause').textContent='RESUME'}});window.addEventListener('blur',()=>{paused=true;current.cancelPointer();document.querySelector('#pause').textContent='RESUME'});window.addEventListener('resize',resize);document.querySelector('#restart').onclick=restart;document.querySelector('#directive').onchange=restart;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'RESUME':'PAUSE'};document.querySelector('#mute').onclick=()=>{muted=!muted;document.querySelector('#mute').textContent=muted?'UNMUTE':'MUTE'};document.querySelector('#help').onclick=()=>alert('Drag optional BONUS reports into FILE +5 or COOL. In phase I, pull the jam strip during stamp rebound, then throw the COUNTER paper into the glowing gear. Phase II: move the red fake ad away. Phase III: route paper during green sweep, pull latch, hit gear. After 3 bolts, DRAG CLOCK OUT to the machine. Pause freezes all gameplay timers.');document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')restart();if(e.key==='Escape')document.querySelector('#pause').click();if(e.key.toLowerCase()==='f')current.scan();});
function frame(ts){let dt=Math.max(0,Math.min(.05,(ts-last)/1000||0));last=ts; if(!paused){current.update(dt);clock+=dt;}c.setTransform(canvas.width/viewport.worldWidth,0,0,canvas.height/viewport.worldHeight,0,0);current.draw(c,viewport);let s=current.snapshot();document.querySelector('#right').textContent=`PHASE ${s.phase}/3 · ${Math.floor(s.activeTimeMs/60000).toString().padStart(2,'0')}:${(Math.floor(s.activeTimeMs/1000)%60).toString().padStart(2,'0')}`;document.querySelector('#stats').textContent=`BOLTS ${s.boltsRemoved}/3  ·  FILED ${s.bonusFiled}/4 (+${s.bonusCorporatePoints})  ·  PRESSURE ${s.pressure}/2  ·  ${s.mode.toUpperCase()}`;window.__QUOTA_STATE=s;requestAnimationFrame(frame);}
resize();restart();requestAnimationFrame(frame);
window.__QUOTA_SCENE=()=>current;window.__QUOTA_EVENTS=()=>received.slice();
</script></body></html>
