<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QUOTA PANIC v3 • Public Relations playable preview</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#152e34;overflow:hidden;font-family:system-ui,sans-serif}canvas{position:fixed;inset:0;width:100vw;height:100dvh;touch-action:none;display:block;cursor:grab}canvas:active{cursor:grabbing}
#toolbar{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:7px;z-index:4;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:min(72vw,440px);pointer-events:auto}button{border:2px solid #163239;background:#fff4d9;color:#18353b;border-radius:9px;padding:8px 10px;min-width:44px;min-height:44px;font-weight:850;cursor:pointer;box-shadow:2px 3px 0 #0b1b20}button[aria-pressed=true]{background:#71e3c4}button:focus-visible{outline:3px solid #ffbd54;outline-offset:2px}
#status{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));color:#fff4d9;z-index:3;font-size:12px;font-weight:800;max-width:33vw;pointer-events:none;text-shadow:0 2px 3px #101c20}#outcome{position:fixed;left:14px;bottom:12px;z-index:5;color:#71e3c4;background:rgba(4,22,25,.8);padding:7px 11px;border-radius:8px;font:700 12px system-ui;pointer-events:none;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:720px){#toolbar{top:auto;bottom:8px;right:8px;gap:3px}button{font-size:11px;padding:5px;min-width:41px;min-height:40px}#status{font-size:10px}}
</style></head><body>
<canvas id="world" aria-label="Playable four-card Public Relations office minigame. Drag, flick and hold the objects in the projected office scene."></canvas>
<div id="status" aria-live="polite">PR DEPARTMENT · 3 ♥</div><nav id="toolbar" aria-label="Preview card selector"><button data-card="P1" aria-pressed="true">P1</button><button data-card="P2" aria-pressed="false">P2</button><button data-card="P3" aria-pressed="false">P3</button><button data-card="P4" aria-pressed="false">P4</button><button id="reset" title="Restart card">↻</button><button id="pause" title="Pause">Ⅱ</button></nav><output id="outcome" aria-live="polite">DRAG THE RED CHART AXIS DOWN</output>
<script type="module">
import {definitions} from '../night-shift-v3/scenes/pr/index.js';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d',{alpha:false});
const result=document.getElementById('outcome'),status=document.getElementById('status');let dpr=1,v,scene,card='P1',paused=false,events=[],raf=0,previous=0;
const options={reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches};
const context={events:{emit(event){events.push(structuredClone(event));if(event.type==='card-complete')result.textContent=`${event.cardId}: ${event.outcome.toUpperCase()} • ${JSON.stringify(event.evidence).slice(0,100)}`;else if(event.type==='card-action')result.textContent=`${event.kind} ${event.correct?'✓':'×'}`;}},run:{events:[],miraIncident:{type:'mira-saved'}},options,audio:{play(name){/* sound intentionally comes from AUDIO lane */}}};
function resize(){const rect=canvas.getBoundingClientRect(),w=Math.max(1,rect.width),h=Math.max(1,rect.height);dpr=Math.max(1,Math.min(window.devicePixelRatio||1,2));canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);const scale=h/760;v={cssWidth:w,cssHeight:h,dpr,worldWidth:w/scale,worldHeight:760,safeRect:{x:30,y:160,w:w/scale-60,h:530},worldToScreen(x,y){return {x:x*scale,y:y*scale}},screenToWorld(x,y){return {x:x/scale,y:y/scale}}};}
function switchTo(id){card=id;scene?.dispose?.();scene=definitions.find(d=>d.id===id).create(context);scene.enter();events=[];result.textContent=definitions.find(d=>d.id===id).imperative;document.querySelectorAll('[data-card]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.card===id)));}
function screenPoint(e){const r=canvas.getBoundingClientRect(),p=v.screenToWorld(e.clientX-r.left,e.clientY-r.top);return {...p,id:e.pointerId,kind:e.pointerType};}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);scene.pointerDown(screenPoint(e),v);});
canvas.addEventListener('pointermove',e=>{scene.pointerMove(screenPoint(e),v);});
canvas.addEventListener('pointerup',e=>{scene.pointerUp(screenPoint(e),v);if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);});
canvas.addEventListener('pointercancel',()=>scene.cancelPointer());
window.addEventListener('blur',()=>{paused=true;scene.cancelPointer();});document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true;scene.cancelPointer();}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key===' '){paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ';}});
document.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>switchTo(b.dataset.card)));
document.getElementById('reset').addEventListener('click',()=>switchTo(card));document.getElementById('pause').addEventListener('click',e=>{paused=!paused;e.target.textContent=paused?'▶':'Ⅱ';});
function frame(ms){const dt=Math.max(0,Math.min(.05,(ms-previous)/1000||0));previous=ms;if(!paused)scene.update(dt);ctx.setTransform(canvas.width/v.cssWidth*v.cssHeight/760,0,0,canvas.height/760,0,0);ctx.clearRect(0,0,v.worldWidth,760);scene.draw(ctx,v);status.textContent=`PR DEPARTMENT · 3 ♥ · ${Math.max(0,Math.ceil((definitions.find(d=>d.id===card)?.seconds||34)-(scene.snapshot().time||0)))}s`;
raf=requestAnimationFrame(frame);}
window.__pr={get scene(){return scene},get viewport(){return v},get events(){return events},get card(){return card},get paused(){return paused},switchTo,resize,context};
resize();switchTo('P1');window.addEventListener('resize',resize,{passive:true});raf=requestAnimationFrame(frame);
</script></body></html>
