<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Quota Panic | SERVICES playable lane preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081a23;color:#f5ebcf;font:900 15px Arial,sans-serif;touch-action:none}#scene{position:fixed;inset:0;display:block;width:100vw;height:100dvh;touch-action:none;cursor:grab;outline:0}
#chrome{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(12px,2vh,28px) clamp(14px,3vw,45px)}
#hud{display:flex;justify-content:space-between;align-items:start;gap:18px;filter:drop-shadow(0 2px 1px #091c25)}
#hud>span{min-width:0}#kicker{font-size:clamp(11px,.9vw,17px);color:#b5ddda;letter-spacing:.14em}#clock{background:#102831;border:3px solid #f8bc61;border-radius:9px;color:#f8c65f;font-size:clamp(19px,2vw,32px);padding:8px 15px;font-variant-numeric:tabular-nums}
#dock{display:flex;align-items:end;justify-content:space-between;gap:10px}#dock small{display:block;background:#071c27da;padding:10px 14px;border:2px solid #4a7883;border-radius:12px;max-width:min(400px,45vw);line-height:1.4;color:#cbe6df}
#tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:end;pointer-events:auto}button,select{font:900 12px Arial,sans-serif;letter-spacing:.04em;cursor:pointer;border:2px solid #172a30;border-radius:10px;color:#0e2b30;background:#f6c762;padding:10px 12px;min-height:40px;box-shadow:0 4px 0 #102a31}button:hover,select:hover{background:#e5f7cb}button:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:3px}
#finish{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:28px;border:5px solid #fac65d;border-radius:24px;background:#102f35ef;color:#f6edda;text-align:center;box-shadow:0 30px 90px #000a;display:none;min-width:min(440px,85vw);max-width:85vw;pointer-events:none}#finish strong{display:block;font-size:clamp(32px,5vw,60px);color:#fac65d;text-shadow:4px 4px #071b28}#finish span{font:700 15px Arial,sans-serif;display:block;margin-top:14px}
@media(max-width:680px){#dock{align-items:stretch;flex-direction:column;gap:6px}#dock small{max-width:100%;font-size:9px;padding:6px}#tools{gap:5px}button,select{font-size:10px;min-height:36px;padding:6px 8px}#chrome{padding:9px}#kicker{font-size:10px}#clock{font-size:17px}}
</style></head><body>
<canvas id="scene" tabindex="0" aria-label="Night Shift Services physical office microgame preview"></canvas>
<div id="chrome"><div id="hud"><span id="kicker">QUOTA PANIC / NIGHT SHIFT v3<br>SERVICES · PHYSICAL DEMO</span><span id="clock">00.0</span></div><div id="dock"><small id="status">Drag with mouse or touch. No score is awarded without manual input. Arrow keys switch cards; R retries; Space pauses.</small><div id="tools"><select id="directive" aria-label="Corporate directive"><option value="fast-or-safe">FAST OR SAFE</option><option value="moving-goalposts">MOVING GOALPOSTS</option><option value="double-entry">DOUBLE ENTRY</option><option value="sponsored-workflow">SPONSORED WORKFLOW</option><option value="mandatory-collaboration">COLLABORATION</option><option value="">NO DIRECTIVE</option></select><button id="prev">◀</button><button id="restart">↺ RETRY</button><button id="next">NEXT ▶</button><button id="pause">PAUSE</button><button id="mute">MUTE</button></div></div></div>
<div id="finish" aria-live="polite"><strong id="finishTitle">FILED!</strong><span id="finishSub">Next card →</span></div>
<script type="module">
import {definitions} from '../night-shift-v3/scenes/services/index.js';
const c=document.getElementById('scene'),g=c.getContext('2d',{alpha:false});const $=s=>document.querySelector(s);
const result=[];const state={idx:0,scene:null,paused:false,muted:false,events:result,now:0,dpr:1,cssW:0,cssH:0,worldWidth:1200,worldHeight:760,drag:false,last:0,frame:0,renderCount:0,error:null};
const viewport={worldHeight:760,worldWidth:1200,cssWidth:0,cssHeight:0,dpr:1,safeRect:{x:280,y:280,w:640,h:380},screenToWorld(x,y){return{x:600+(x-this.cssWidth/2)*760/this.cssHeight,y:y*760/this.cssHeight}},worldToScreen(x,y){return{x:this.cssWidth/2+(x-600)*this.cssHeight/760,y:y*this.cssHeight/760}}};
const sound={ctx:null,play(kind){if(state.muted)return;try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();const a=this.ctx,t=a.currentTime,o=a.createOscillator(),amp=a.createGain();o.type=kind==='error'||kind==='fail'?'sawtooth':'triangle';o.frequency.setValueAtTime(kind==='catch'?440:kind==='complete'?620:kind==='error'?180:kind==='grab'?280:360,t);o.frequency.exponentialRampToValueAtTime(kind==='complete'?1000:kind==='error'?95:510,t+.14);amp.gain.setValueAtTime(.0001,t);amp.gain.exponentialRampToValueAtTime(.08,t+.012);amp.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(amp);amp.connect(a.destination);o.start(t);o.stop(t+.22)}catch(e){}}};
const events={emit(ev){result.push(JSON.parse(JSON.stringify(ev)));if(ev.type==='card-complete'||ev.type==='card-failed'){state.doneEvent=ev;$('#finishTitle').textContent=ev.type==='card-failed'?'UNFILED!':'NICE SAVE!';$('#finishSub').textContent=ev.type==='card-failed'?'Retry this attempt with ↺ RETRY':'Completed: '+ev.cardId+' • NEXT ▶ to continue';state.bannerAt=performance.now()+650;const e=ev.evidence||{};const detail=ev.cardId==='S1'?`${e.cleanFiles??0} clean files ready for the printer`:ev.cardId==='S2'?`${e.caught??0} caught • ${e.spilled??0} spilled • Mira ${e.miraWorkstation??'waiting'}`:ev.cardId==='S3'?`${e.safePull?'Safe pull opened feeder':'Printer needs another safe pull'}`:ev.cardId==='S4'?`${ev.type==='card-complete'?'Network reconnected':'Reconnect the real port'}`:'Retry the task';$('#status').textContent=`${ev.cardId} • ${ev.outcome.toUpperCase()} • ${detail}`;window.__lastCardEvent=ev}}};
function resize(){const rect=c.getBoundingClientRect();viewport.cssWidth=state.cssW=rect.width;viewport.cssHeight=state.cssH=rect.height;const physical=Math.min(window.devicePixelRatio||1,3);viewport.dpr=state.dpr=physical;viewport.worldWidth=state.worldWidth=760*rect.width/rect.height;c.width=Math.round(rect.width*physical);c.height=Math.round(rect.height*physical);viewport.safeRect={x:600-Math.min(490,viewport.worldWidth/2-42),y:285,w:Math.min(980,viewport.worldWidth-84),h:385};g.imageSmoothingEnabled=true;}
function load(idx){state.idx=(idx+definitions.length)%definitions.length;state.doneEvent=null;state.bannerAt=Infinity;state.error=null;$('#finish').style.display='none';state.scene?.dispose?.();state.scene=definitions[state.idx].create({viewport,canvas:c,ctx2d:g,events,audio:sound,options:{directive:$('#directive').value,attemptId:`services-${definitions[state.idx].id}-${Date.now()}`},rng:()=>.42});state.scene.enter();$('#status').textContent=`${definitions[state.idx].id} / ${definitions[state.idx].imperative} • drag/catch/hold the physical objects`}
function draw(){if(c.width===0)return;g.setTransform(c.width/viewport.worldWidth,0,0,c.height/760,(c.width/viewport.worldWidth)*(viewport.worldWidth/2-600),0);try{state.scene.draw(g,viewport)}catch(e){state.error=String(e);$('#status').textContent='RENDER ERROR '+e;console.error(e)}$('#clock').textContent=state.scene.snapshot().remaining.toFixed(1)+'s';}
function loop(ts){if(!state.last)state.last=ts;const dt=Math.min(.05,(ts-state.last)/1000);state.last=ts;if(!state.paused&&document.visibilityState==='visible'){state.scene?.update(dt);state.now+=dt}draw();if(state.doneEvent&&ts>=state.bannerAt)$('#finish').style.display='block';state.frame++;requestAnimationFrame(loop)}
function point(e){const r=c.getBoundingClientRect();return viewport.screenToWorld(e.clientX-r.left,e.clientY-r.top)}
c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);state.drag=true;state.scene.pointerDown({...point(e),id:e.pointerId,kind:e.pointerType});sound.ctx?.resume?.()});c.addEventListener('pointermove',e=>{if(state.drag)state.scene.pointerMove({...point(e),id:e.pointerId,kind:e.pointerType})});c.addEventListener('pointerup',e=>{if(!state.drag)return;state.drag=false;state.scene.pointerUp({...point(e),id:e.pointerId,kind:e.pointerType})});c.addEventListener('pointercancel',()=>{state.drag=false;state.scene.cancelPointer()});
$('#prev').onclick=()=>load(state.idx-1);$('#next').onclick=()=>load(state.idx+1);$('#restart').onclick=()=>load(state.idx);$('#directive').onchange=()=>load(state.idx);$('#pause').onclick=()=>{state.paused=!state.paused;$('#pause').textContent=state.paused?'RESUME':'PAUSE'};$('#mute').onclick=()=>{state.muted=!state.muted;$('#mute').textContent=state.muted?'SOUND':'MUTE'};
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')load(state.idx+1);if(e.key==='ArrowLeft')load(state.idx-1);if(e.key.toLowerCase()==='r')load(state.idx);if(e.code==='Space'){$('#pause').click();e.preventDefault()}});
window.addEventListener('resize',resize);resize();load(0);requestAnimationFrame(loop);
window.__services={state,viewport,definitions,load,events:result,draw,resize};
</script></body></html>
