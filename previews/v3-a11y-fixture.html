<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quota Panic · Input Verification Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14292d;font-family:system-ui,Arial,sans-serif}canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none}button{border:2px solid #e9b862;background:#163a3f;color:#fff8d9;border-radius:10px;padding:.8rem 1.2rem;font-size:1rem;font-weight:800;cursor:pointer}button:focus-visible{outline:4px solid #9dffe5;outline-offset:3px}button:hover{background:#23535a}.overlay{position:fixed;z-index:2;pointer-events:none}#title{inset:0;display:grid;place-items:center;text-align:center;background:#10313a55}#title article{pointer-events:auto;max-width:560px;padding:2rem;color:#fff1cc;background:#17353cdd;border:3px solid #e9b862;box-shadow:0 25px 70px #0009;transform:rotate(-1deg)}h1{font-size:clamp(2rem,7vw,5rem);line-height:.95;letter-spacing:-.08em;margin:.3rem 0}h1 small{display:block;font-size:.28em;letter-spacing:.1em;color:#e8bb69}#top{top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;color:#fff1cb;font-weight:900;text-shadow:0 2px 3px #0009;gap:10px}#top button{pointer-events:auto;padding:.5rem .75rem;font-size:.9rem}#pauseLayer{inset:0;display:none;place-items:center;background:#092528bd;color:white;text-align:center}#pauseLayer h2{font-size:clamp(3rem,8vw,7rem);line-height:1;margin:0;color:#ffdc90}#pauseLayer p{font-size:1.1rem}#pauseLayer button{pointer-events:auto}#instructions{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#12323dc7;color:#fdf3d8;padding:.4rem .7rem;font-size:clamp(.65rem,1.3vw,.9rem);border-radius:10px;text-align:center;max-width:90vw;pointer-events:none}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="game" role="application" tabindex="0" aria-label="Interaction verification lab; click or touch paper to stamp; Escape pauses; M mutes"></canvas>
<div id="title" class="overlay"><article><div>INTERNAL QA // NOT A GAME RELEASE</div><h1>QUOTA <small>PANIC · INPUT LAB</small></h1><p>Canvas pointer, keyboard menu, pause and mute test fixture.</p><button id="clockIn" data-qa="clock-in">CLOCK IN ↵</button></article></div>
<div id="top" class="overlay"><span id="hearts">♥ ♥ ♥ &nbsp; TEST LAB</span><span><button id="pauseBtn" aria-label="Pause or resume" type="button">PAUSE · ESC</button> <button id="muteBtn" aria-label="Mute or unmute" type="button">SOUND · M</button> <span id="timer" aria-live="off">12.0</span></span></div>
<div id="pauseLayer" class="overlay" role="dialog" aria-modal="true" aria-label="Paused"><section><h2>ON BREAK</h2><p>Your clock is frozen. Corporate cannot bill this.</p><button id="resumeBtn">RESUME ↵</button></section></div>
<div id="instructions">Drag the paper to stamp it. Try Escape, M, Tab, touch, and pointercancel.</div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');let scene='title',dragging=false,pointerId=null,muted=false,clock=12,actions=0,last=0;
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const sheet=()=>({x:innerWidth*.5-85,y:innerHeight*.5-92,w:170,h:184});
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);c.setTransform(dpr,0,0,dpr,0,0)}
function paper(cx,cy,angle=0){c.save();c.translate(cx,cy);c.rotate(angle);c.shadowColor='#031718';c.shadowBlur=20;c.shadowOffsetY=12;c.fillStyle='#fff6dd';c.fillRect(-85,-92,170,184);c.shadowBlur=0;c.shadowOffsetY=0;c.strokeStyle='#1a7770';c.lineWidth=4;c.strokeRect(-85,-92,170,184);c.strokeStyle='#c3b69b';c.lineWidth=2;for(let i=0;i<4;i++){c.beginPath();c.moveTo(-58,-39+i*26);c.lineTo(58,-39+i*26);c.stroke()}c.fillStyle='#da5946';c.font='900 26px system-ui';c.textAlign='center';c.fillText(actions?'APPROVED!':'STAMP ME',0,73);c.restore()}
function draw(t){const w=innerWidth,h=innerHeight;c.clearRect(0,0,w,h);const bg=c.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#214c54');bg.addColorStop(1,'#11343a');c.fillStyle=bg;c.fillRect(0,0,w,h);c.fillStyle='#234b4c';c.fillRect(0,h*.18,w,h*.2);c.fillStyle='#dfb56f';c.fillRect(0,h*.76,w,h*.24);c.fillStyle='#a87343';c.fillRect(0,h*.755,w,h*.025);c.fillStyle='#112b34';c.fillRect(w*.06,h*.25,w*.16,h*.46);c.fillStyle='#eabe79';c.fillRect(w*.08,h*.28,w*.12,h*.22);c.fillStyle='#f6e8c9';c.font=`900 ${Math.max(14,Math.min(w*.023,27))}px system-ui`;c.textAlign='center';c.fillText('INPUT',w*.14,h*.38);c.fillText('LAB',w*.14,h*.44);c.textAlign='left';c.font=`900 ${Math.max(22,Math.min(w*.035,44))}px system-ui`;c.fillText('STAMP IT.',Math.max(18,w*.23),Math.max(108,h*.22));if(scene!=='title')paper(w/2,h/2,!reduced()&&!dragging?Math.sin(t*.0015)*.025:0);
 if(dragging){c.strokeStyle='#c9ffb5';c.lineWidth=7;c.strokeRect(w/2-92,h/2-99,184,198)}
}
function updateHud(){document.querySelector('#timer').textContent=clock.toFixed(1);document.querySelector('#muteBtn').textContent=muted?'MUTED · M':'SOUND · M';document.querySelector('#pauseLayer').style.display=scene==='pause'?'grid':'none';document.querySelector('#title').style.display=scene==='title'?'grid':'none'}
function start(){scene='play';clock=12;actions=0;dragging=false;updateHud();canvas.focus()}
function pause(){if(scene==='play')scene='pause';else if(scene==='pause')scene='play';dragging=false;updateHud()}
function mute(){muted=!muted;updateHud()}
function pos(evt){let r=canvas.getBoundingClientRect();return {x:evt.clientX-r.left,y:evt.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{if(scene!=='play')return;const p=pos(e),s=sheet();if(p.x>=s.x&&p.x<=s.x+s.w&&p.y>=s.y&&p.y<=s.y+s.h){dragging=true;pointerId=e.pointerId;try{canvas.setPointerCapture(e.pointerId)}catch{}}});
canvas.addEventListener('pointerup',e=>{if(e.pointerId===pointerId&&dragging&&scene==='play'){actions++;clock=Math.min(12,clock+1);dragging=false;pointerId=null;updateHud()}});
canvas.addEventListener('pointercancel',()=>{dragging=false;pointerId=null});canvas.addEventListener('lostpointercapture',()=>{dragging=false;pointerId=null});
document.querySelector('#clockIn').onclick=start;document.querySelector('#pauseBtn').onclick=pause;document.querySelector('#resumeBtn').onclick=pause;document.querySelector('#muteBtn').onclick=mute;
addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();pause()}if(e.key.toLowerCase()==='m'&&!e.repeat){mute()}if(e.key==='f'&&!e.repeat&&document.fullscreenEnabled){document.documentElement.requestFullscreen().catch(()=>{})}});
addEventListener('resize',resize);resize();updateHud();requestAnimationFrame(function loop(now){if(scene==='play'&&last)clock=Math.max(0,clock-(now-last)/1000);last=now;if(scene==='play'&&clock===0){scene='pause';updateHud()}if(scene==='play')updateHud();draw(now);requestAnimationFrame(loop)});
window.__nightShiftV3={snapshot:()=>({screen:scene,clock:clock.toFixed(1),muted,dragging,actions,options:{reducedMotion:reduced()},qaTargets:[{x:innerWidth/2,y:innerHeight/2,coordinate:'css'}]})};
})();
</script></body></html>
