<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUOTA PANIC · NIGHT SHIFT</title><meta name="description" content="Six fast, ridiculous office microgames. A vicious office arcade with precision, interference, a hostile printer and a rigged performance review.">
<style>
:root{color-scheme:dark;--ink:#111c20;--cream:#f3ecde;--gold:#e6b44a;--mint:#24c49c;--red:#df4b37}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141e21;font-family:'Arial Narrow','Liberation Sans Narrow','Impact',Arial,sans-serif;touch-action:none}
body{display:block;background:#141e21}
#wrap{position:fixed;inset:0;width:100vw;height:100dvh;box-shadow:none;border:0;border-radius:0;overflow:hidden}
canvas{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none;outline:none}
#links{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:15px;pointer-events:none;opacity:.9}
#links a{pointer-events:auto;font-size:12px;color:#376675;text-decoration:underline;text-underline-offset:3px}
#help{position:absolute;inset:0;z-index:5;background:#061929db;color:#fff0d3;display:none;align-items:center;justify-content:center;padding:20px}
#help.show{display:flex}#help article{width:min(670px,94%);max-height:91%;overflow:auto;background:#173746;border:2px solid #89e5cd;border-radius:18px;padding:24px 30px;box-shadow:0 12px 40px #0008}
#help h2{margin:0 0 10px;color:#f5c376;letter-spacing:-1px;font-size:25px}#help p{line-height:1.5;font-size:14px;margin:10px 0}#help a{color:#93e7d3}#help button{background:#f5bf65;border:0;border-radius:9px;color:#173544;font-weight:900;padding:12px 20px;cursor:pointer}
#sr{position:absolute;left:-10000px;top:auto;height:1px;overflow:hidden}
@media(max-width:650px){#wrap{width:100vw;border-radius:0;border:none}#links{bottom:3px}#links a{font-size:8px}}

/* Game surfaces scale independently; screen chrome renders at device resolution. */
#wrap{background:#192927}
#game{width:100%;height:100%}
#intermission{display:none;position:absolute;inset:0;z-index:6;color:#263c3c;background:#192a2d;font-family:Arial,'Segoe UI',sans-serif;overflow:auto;padding:clamp(12px,2.6vh,32px)}
#intermission.visible{display:grid;place-items:center}
.im-shell{width:min(1300px,100%);min-height:min(680px,95vh);max-height:95vh;display:grid;grid-template-columns:minmax(260px,.72fr) minmax(0,1.35fr);background:#e7e5de;box-shadow:0 28px 80px #0008;border:1px solid #566f67;overflow:hidden}
.im-mail{background:#f7f8f7;display:flex;flex-direction:column;border-right:3px solid #c4cfc9;min-width:0}
.im-top{height:45px;background:#144e47;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:14px;font-weight:700;letter-spacing:.035em}
.im-mail-chrome{display:flex;gap:15px;border-bottom:1px solid #dce3df;padding:10px 17px;font-size:12px;color:#57736a}
.im-mail-msg{padding:25px clamp(14px,2vw,28px);flex:1;display:flex;flex-direction:column}
.im-flag{font-size:11px;color:#ad5542;letter-spacing:.12em;font-weight:800;margin-bottom:8px}
.im-subject{font-size:clamp(25px,2.35vw,39px);line-height:1.04;letter-spacing:-.05em;font-weight:900;margin:0 0 21px;color:#173b38}
.im-sender{font-size:12px;border-bottom:1px solid #dce2dc;padding-bottom:15px;color:#6e837d;line-height:1.55}
.im-sender strong{font-size:14px;color:#233c39}
.im-copy{font-size:clamp(15px,1.2vw,18px);line-height:1.45;max-width:36ch;color:#2d4944;margin:22px 0 10px}
.im-copy strong{color:#a84a36}
.im-attach{margin-top:auto;background:#e8f2ec;border:1px solid #b0c5b6;display:flex;align-items:center;gap:12px;padding:14px 13px;color:#1b5042;font-size:13px;font-weight:800}
.im-attach-mark{font-size:25px;background:#178253;color:#fff;padding:8px 11px;border-radius:4px}
.im-bottom{background:#e7eeea;padding:14px 18px;display:flex;gap:8px;color:#52756b;font-size:12px}
.im-workbook{min-width:0;display:flex;flex-direction:column;background:#fff}
.im-workbar{background:#196b48;color:#fff;min-height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:14px;font-weight:800}
.im-ribbon{border-bottom:1px solid #c9d9d0;display:flex;gap:16px;padding:12px 18px;font-size:12px;color:#476e5e;background:#f0f5f1}
.im-formula{border-bottom:1px solid #c7d3cd;display:flex;align-items:center;height:43px;gap:10px;font-size:13px;color:#789083;padding:0 12px}
.im-namebox{border:1px solid #c9d7ce;padding:6px 19px;color:#345546}
.im-fx{font-weight:900;font-style:italic;font-size:17px;color:#318268}
.im-formula span:last-child{color:#566e61;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im-grid-wrap{padding:14px 14px 8px;overflow:auto;flex:1}
.im-summary{background:#1a3333;color:#eae7db;padding:15px 20px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12px;font-weight:800}
.im-summary b{color:#f2bb63;font-size:16px}
.im-work-heading{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:900;color:#517465;margin:4px 0 12px}
.im-grid{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-family:Arial,sans-serif;font-size:12px}
.im-grid th,.im-grid td{border-right:1px solid #c7d7d0;border-bottom:1px solid #c7d7d0;vertical-align:middle}
.im-grid thead th{background:#e7eee9;color:#617d72;height:25px;font-weight:700;font-size:12px}
.im-grid tbody th{background:#edf3ef;width:36px;font-weight:600;color:#779184}
.im-grid td{height:70px;background:#fff;min-width:0;overflow:hidden}
.im-grid td:first-of-type{width:70px;padding:5px;text-align:center;background:#f6f8f6;color:#7a9085;font-weight:900}
.im-grid tr.active td:first-of-type{background:#146a47;color:#fff}
.im-cell{min-height:69px;height:100%;width:100%;border:0;background:#f5f7f4;color:#607970;display:flex;flex-direction:column;justify-content:center;text-align:left;gap:4px;padding:8px 9px;font-family:inherit;font-size:11px;overflow:hidden}
.im-cell strong{font-size:12px;color:inherit;white-space:normal;line-height:1.2}
.im-cell small{font-size:11px;opacity:.82;line-height:1.15}
button.im-cell.pick{cursor:pointer;background:#fff6e4;color:#2a4c42;box-shadow:inset 0 0 0 2px #dcb363;transition:background .1s,transform .1s}
button.im-cell.pick:hover,button.im-cell.pick:focus-visible{background:#e5f7e7;box-shadow:inset 0 0 0 3px #1b995c;outline:none;transform:scale(.99)}
.im-cell.picked{background:#d9eee2;color:#116042;box-shadow:inset 0 0 0 2px #2b9e6d}
.im-cell.missed{background:#f2eeea;color:#9caaa2}
.im-cell.locked{background:repeating-linear-gradient(135deg,#f2f5f2,#f2f5f2 7px,#e8eee9 7px,#e8eee9 14px);color:#91a39a;text-align:center;align-items:center}
.im-foot{padding:9px 16px;font-size:12px;color:#567667;background:#eaf2ed;border-top:1px solid #c4d6ca;font-weight:700}
@media(max-width:900px){#intermission{padding:8px}.im-shell{grid-template-columns:1fr;max-height:none;min-height:100%;overflow:visible}.im-mail{border-right:0;border-bottom:2px solid #c5d7c7}.im-mail-msg{padding:16px;gap:4px}.im-subject{margin-bottom:5px;font-size:26px}.im-copy{margin:10px 0}.im-attach{margin-top:5px;padding:7px}.im-mail-chrome,.im-bottom{display:none}.im-grid td{height:64px}.im-cell{min-height:64px}}
@media(max-width:570px){.im-ribbon{display:none}.im-grid-wrap{padding:6px}.im-grid td{height:70px}.im-cell{padding:4px 5px}.im-cell strong{font-size:10px}.im-cell small{font-size:9px}.im-subject{font-size:23px}.im-workbar{font-size:12px}}
